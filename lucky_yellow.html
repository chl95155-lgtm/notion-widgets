<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --primary-yellow: #FBC02D;   /* 포인트 진한 노랑 */
            --soft-yellow: #FFF59D;      /* 테두리 및 구분선 */
            --bg-yellow: #FFFDE7;        /* 카드 배경 */
            --today-bg: #FFF9C4;         /* 오늘 날짜 강조 배경 */
            --text-dark: #333333;        /* 텍스트 본문 */
            --sun-red: #D32F2F;          /* 일요일 색상 */
            --sat-blue: #1976D2;         /* 토요일 색상 */
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: transparent;
            margin: 0;
            padding: 12px;
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 2px solid var(--soft-yellow);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(251, 192, 45, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h2 {
            font-size: 19px;
            color: #F57F17;
            margin: 0 0 4px 0;
            font-weight: 800;
        }

        .week-range {
            font-size: 12px;
            color: #757575;
            font-weight: 600;
        }

        /* 7일 리스트 레이아웃 (세로 전체 노출) */
        .days-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-card {
            background: var(--bg-yellow);
            border: 1px solid var(--soft-yellow);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 오늘 날짜 강조 스타일 */
        .day-card.is-today {
            background: var(--today-bg);
            border: 2px solid var(--primary-yellow);
            box-shadow: 0 4px 12px rgba(251, 192, 45, 0.2);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--soft-yellow);
            padding-bottom: 6px;
        }

        .day-title {
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .day-title.sun { color: var(--sun-red); }
        .day-title.sat { color: var(--sat-blue); }
        .day-title.weekday { color: #E65100; }

        .date-badge {
            font-size: 11.5px;
            color: #757575;
            font-weight: 500;
        }

        .today-tag {
            background: #E65100;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 700;
        }

        .score-badge {
            background: var(--primary-yellow);
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .fortune-summary {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0;
            line-height: 1.5;
            word-break: keep-all;
        }

        .fortune-details {
            font-size: 12px;
            color: #616161;
            margin: 0;
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 10px;
            border-radius: 10px;
        }

        .empty-msg {
            color: #9E9E9E;
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>✨ 이번 주 운세 (일~토)</h2>
        <div class="week-range" id="weekRange">로딩 중...</div>
    </div>
    
    <div class="days-list" id="daysList">
        <div class="empty-msg">7일치 시트 데이터를 불러오는 중입니다...</div>
    </div>
</div>

<script>
    function cleanNumericDate(dateStr) {
        if (!dateStr) return '';
        return dateStr.replace(/[^0-9]/g, '').trim();
    }

    function getWeekDates() {
        const now = new Date();
        const currentDay = now.getDay(); // 0(일) ~ 6(토)
        const todayNumeric = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;

        const dayNames = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
        const week = [];

        // 이번 주 일요일 계산
        const sunday = new Date(now);
        sunday.setDate(now.getDate() - currentDay);

        for (let i = 0; i < 7; i++) {
            const d = new Date(sunday);
            d.setDate(sunday.getDate() + i);

            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const date = String(d.getDate()).padStart(2, '0');

            const num1 = `${y}${m}${date}`;
            const num2 = `${y}${d.getMonth() + 1}${d.getDate()}`;

            week.push({
                name: dayNames[i],
                dayIndex: i,
                displayDate: `${m}.${date}`,
                fullDisplay: `${y}-${m}-${date}`,
                matchKeys: [num1, num2],
                isToday: num1 === todayNumeric
            });
        }
        return week;
    }

    async function loadWeeklyFortunes() {
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJt4nYJdDup0o50_TUEeOAK4jKs9mPzXXd8sf-APg0BBn4BEdemk-8v1i3yXbDaIUqnPQvarfRSFVJ/pub?gid=0&single=true&output=csv';

        try {
            const res = await fetch(sheetUrl);
            const data = await res.text();

            const rows = data.replace(/\r/g, '').split('\n').map(r => {
                const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
                return r.split(regex).map(cell => {
                    return cell.trim().replace(/^"|"$/g, '').replace(/""/g, '"');
                });
            });

            const week = getWeekDates();
            document.getElementById('weekRange').textContent = `${week[0].fullDisplay} ~ ${week[6].fullDisplay}`;

            const listContainer = document.getElementById('daysList');
            listContainer.innerHTML = '';

            week.forEach(dayInfo => {
                const matchedRow = rows.find(r => {
                    if (!r[0]) return false;
                    const sheetDate = cleanNumericDate(r[0]);
                    return dayInfo.matchKeys.includes(sheetDate);
                });

                const card = document.createElement('div');
                card.className = `day-card ${dayInfo.isToday ? 'is-today' : ''}`;

                let dayColorClass = 'weekday';
                if (dayInfo.dayIndex === 0) dayColorClass = 'sun';
                if (dayInfo.dayIndex === 6) dayColorClass = 'sat';

                const score = matchedRow ? (matchedRow[1] || "-") + "점" : "-";
                const summary = matchedRow ? (matchedRow[2] || "운세 데이터 없음") : "시트에 해당 일자 데이터가 없습니다.";
                const money = matchedRow ? (matchedRow[3] || "-") : "-";
                const luckColor = matchedRow ? (matchedRow[4] || "-") : "-";

                card.innerHTML = `
                    <div class="card-top">
                        <div class="day-title ${dayColorClass}">
                            ${dayInfo.name} <span class="date-badge">(${dayInfo.displayDate})</span>
                            ${dayInfo.isToday ? '<span class="today-tag">오늘</span>' : ''}
                        </div>
                        <div class="score-badge">${score}</div>
                    </div>
                    <p class="fortune-summary">${summary}</p>
                    <div class="fortune-details">
                        <span>💰 재물: ${money}</span>
                        <span>🎨 행운 컬러: ${luckColor}</span>
                    </div>
                `;

                listContainer.appendChild(card);
            });

        } catch (e) {
            console.error(e);
            document.getElementById('daysList').innerHTML = `<div class="empty-msg">구글 시트 연결 오류가 발생했습니다.</div>`;
        }
    }

    loadWeeklyFortunes();
</script>
</body>
</html>
