<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --dark-yellow: #FBC02D;    /* 메인 진한 노랑 */
            --border-yellow: #FBC02D;  /* 진한 노랑 테두리 */
            --border-today: #F57F17;   /* 오늘 강조 진한 골드 테두리 */
            --bg-yellow: #FFFDE7;      /* 카드 배경 크림 옐로우 */
            --today-bg: #FFF9C4;       /* 오늘 날짜 배경 */
            --text-dark: #2A2A2A;      /* 평일 날짜 및 본문 검정 */
            --sun-red: #D32F2F;        /* 일요일 & 공휴일 빨강 */
            --sat-blue: #1976D2;       /* 토요일 파랑 */
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: transparent;
            font-family: 'Pretendard', -apple-system, sans-serif;
        }

        body {
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            background: #ffffff;
            border: 2.5px solid var(--border-yellow);
            border-radius: 20px;
            padding: 12px 10px;
            box-shadow: 0 4px 15px rgba(251, 192, 45, 0.15);
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h2 {
            font-size: 17px;
            color: #F57F17;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        /* 💥 핵심: 7개 열이 화면 밖으로 절대 안 튀어나가게 1/7씩 강제 압축 고정 */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 5px;
            width: 100%;
        }

        .day-card {
            background: var(--bg-yellow);
            border: 1.5px solid var(--border-yellow);
            border-radius: 12px;
            padding: 8px 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0; /* 내부 텍스트 때문에 카드가 늘어나는 현상 원천 차단 */
            min-height: 170px;
            overflow: hidden;
        }

        /* 오늘 날짜 카드 강조 */
        .day-card.is-today {
            background: var(--today-bg);
            border: 2px solid var(--border-today);
            box-shadow: 0 2px 8px rgba(245, 127, 23, 0.25);
        }

        .card-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            border-bottom: 1px dashed #FBC02D;
            padding-bottom: 5px;
            margin-bottom: 5px;
            width: 100%;
        }

        /* 날짜 및 오늘 뱃지 한 줄 정렬 */
        .date-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 100%;
        }

        .day-date-label {
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        .day-date-label.weekday { color: #212121; } /* 평일 검정 */
        .day-date-label.sat { color: var(--sat-blue); } /* 토요일 파랑 */
        .day-date-label.sun, 
        .day-date-label.holiday { color: var(--sun-red); } /* 일요일/공휴일 빨강 */

        /* 요일 바로 옆 '오늘' 뱃지 */
        .today-tag {
            background: #F57F17;
            color: #ffffff;
            font-size: 8.5px;
            padding: 1px 3px;
            border-radius: 4px;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
        }

        .score-badge {
            background: var(--dark-yellow);
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 6px;
            margin-top: 1px;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            justify-content: space-between;
            width: 100%;
        }

        .fortune-summary {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--text-dark);
            margin: 0;
            line-height: 1.35;
            word-break: break-all; /* 단어가 길어도 자동 줄바꿈되어 잘림 방지 */
            text-align: center;
        }

        .fortune-details {
            font-size: 9.5px;
            color: #4E342E;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(255, 255, 255, 0.8);
            padding: 4px;
            border-radius: 6px;
            line-height: 1.3;
            width: 100%;
        }

        .detail-item {
            display: block;
            word-break: break-all; /* 내용이 길어도 다음 줄로 자연스럽게 넘김 */
        }

        .empty-msg {
            color: #9E9E9E;
            font-size: 12px;
            text-align: center;
            padding: 20px 0;
            grid-column: span 7;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 id="mainTitle">✨ 이번주 운세</h2>
    </div>
    
    <div class="days-grid" id="daysGrid">
        <div class="empty-msg">7일치 시트 데이터를 불러오는 중입니다...</div>
    </div>
</div>

<script>
    const holidays2026 = {
        0: [1],
        1: [16, 17, 18],
        2: [1, 2],
        4: [5, 24, 25],
        5: [6],
        7: [15, 17],
        8: [24, 25, 26],
        9: [3, 5, 9],
        11: [25]
    };

    function cleanNumericDate(dateStr) {
        if (!dateStr) return '';
        return dateStr.replace(/[^0-9]/g, '').trim();
    }

    function getWeekDates() {
        const now = new Date();
        const currentDay = now.getDay(); // 0(일) ~ 6(토)
        const todayNumeric = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;

        const shortDays = ["일", "월", "화", "수", "목", "금", "토"];
        const week = [];

        const sunday = new Date(now);
        sunday.setDate(now.getDate() - currentDay);

        for (let i = 0; i < 7; i++) {
            const d = new Date(sunday);
            d.setDate(sunday.getDate() + i);

            const y = d.getFullYear();
            const m = d.getMonth();
            const date = d.getDate();

            const monthStr = String(m + 1).padStart(2, '0');
            const dateStr = String(date).padStart(2, '0');

            const num1 = `${y}${monthStr}${dateStr}`;
            const num2 = `${y}${m + 1}${date}`;

            const isHoliday = holidays2026[m] && holidays2026[m].includes(date);

            week.push({
                dayIndex: i,
                formattedDate: `${monthStr}.${dateStr}(${shortDays[i]})`,
                matchKeys: [num1, num2],
                isToday: num1 === todayNumeric,
                isHoliday: isHoliday
            });
        }
        return week;
    }

    async function loadWeeklyFortunes() {
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJt4nYJdDup0o50_TUEeOAK4jKs9mPzXXd8sf-APg0BBn4BEdemk-8v1i3yXbDaIUqnPQvarfRSFVJ/pub?gid=0&single=true&output=csv';

        try {
            const res = await fetch(sheetUrl);
            const data = await res.text();

            const rows = data.replace(/\r/g, '').split('\n').map(r => {
                const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
                return r.split(regex).map(cell => {
                    return cell.trim().replace(/^"|"$/g, '').replace(/""/g, '"');
                });
            });

            const week = getWeekDates();
            
            const startDate = week[0].formattedDate.split('(')[0];
            const endDate = week[6].formattedDate.split('(')[0];
            document.getElementById('mainTitle').textContent = `✨ 이번주 운세 (${startDate} ~ ${endDate})`;

            const gridContainer = document.getElementById('daysGrid');
            gridContainer.innerHTML = '';

            week.forEach(dayInfo => {
                const matchedRow = rows.find(r => {
                    if (!r[0]) return false;
                    const sheetDate = cleanNumericDate(r[0]);
                    return dayInfo.matchKeys.includes(sheetDate);
                });

                const card = document.createElement('div');
                card.className = `day-card ${dayInfo.isToday ? 'is-today' : ''}`;

                let colorClass = 'weekday';
                if (dayInfo.dayIndex === 0) colorClass = 'sun';
                else if (dayInfo.dayIndex === 6) colorClass = 'sat';
                
                if (dayInfo.isHoliday) {
                    colorClass = 'holiday';
                }

                const score = matchedRow ? (matchedRow[1] || "-") + "점" : "-";
                const summary = matchedRow ? (matchedRow[2] || "운세 데이터 없음") : "시트에 데이터 없음";
                const money = matchedRow ? (matchedRow[3] || "-") : "-";
                const luckColor = matchedRow ? (matchedRow[4] || "-") : "-";

                card.innerHTML = `
                    <div class="card-top">
                        <div class="date-row">
                            <span class="day-date-label ${colorClass}">${dayInfo.formattedDate}</span>
                            ${dayInfo.isToday ? '<span class="today-tag">오늘</span>' : ''}
                        </div>
                        <div class="score-badge">${score}</div>
                    </div>
                    <div class="card-body">
                        <p class="fortune-summary">${summary}</p>
                        <div class="fortune-details">
                            <span class="detail-item">💰 ${money}</span>
                            <span class="detail-item">🎨 ${luckColor}</span>
                        </div>
                    </div>
                `;

                gridContainer.appendChild(card);
            });

        } catch (e) {
            console.error(e);
            document.getElementById('daysGrid').innerHTML = `<div class="empty-msg">구글 시트 연결 오류가 발생했습니다.</div>`;
        }
    }

    loadWeeklyFortunes();
</script>
</body>
</html>
