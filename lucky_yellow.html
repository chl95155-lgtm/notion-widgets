<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            box-sizing: border-box !important;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: 'Pretendard', -apple-system, sans-serif;
            overflow-x: hidden;
        }

        body {
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 겉 테두리: 진한 노랑(#FBC02D) 3px 강제 적용 */
        .container {
            width: 100%;
            max-width: 100%;
            background: #ffffff;
            border: 3px solid #FBC02D !important;
            border-radius: 20px;
            padding: 14px 10px;
            box-shadow: 0 4px 15px rgba(251, 192, 45, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .header h2 {
            font-size: 17px;
            color: #E65100;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        /* 💥 7개 카드가 절대로 아래로 떨어지거나 밖으로 안 삐져나가게 강제 분할 */
        .days-grid {
            display: grid !important;
            grid-template-columns: repeat(7, calc((100% - 30px) / 7)) !important;
            gap: 5px !important;
            width: 100% !important;
        }

        /* 개별 카드: 진한 노랑(#FBC02D) 테두리 */
        .day-card {
            background: #FFFDE7 !important;
            border: 2px solid #FBC02D !important;
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0 !important;
            width: 100% !important;
            min-height: 165px;
            overflow: hidden;
        }

        /* 오늘 날짜: 더 진한 골드 오렌지(#F57F17) 테두리 + 배경 */
        .day-card.is-today {
            background: #FFF9C4 !important;
            border: 2.5px solid #F57F17 !important;
            box-shadow: 0 3px 10px rgba(245, 127, 23, 0.3) !important;
        }

        .card-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            border-bottom: 1px dashed #FBC02D;
            padding-bottom: 5px;
            margin-bottom: 5px;
            width: 100%;
        }

        /* 날짜와 '오늘' 뱃지를 완벽하게 가로 1줄로 배치 */
        .date-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 100%;
            white-space: nowrap;
        }

        .day-date-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* 날짜 색상 규칙 */
        .day-date-label.weekday { color: #000000 !important; } /* 평일: 검정 */
        .day-date-label.sat { color: #1976D2 !important; }     /* 토요일: 파랑 */
        .day-date-label.sun, 
        .day-date-label.holiday { color: #D32F2F !important; } /* 일요일/공휴일: 빨강 */

        /* 요일 바로 옆 '오늘' 뱃지 */
        .today-tag {
            background: #F57F17 !important;
            color: #ffffff !important;
            font-size: 8.5px;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 800;
            line-height: 1;
        }

        .score-badge {
            background: #FBC02D;
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 6px;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            justify-content: space-between;
            width: 100%;
        }

        .fortune-summary {
            font-size: 10px;
            font-weight: 600;
            color: #212121;
            line-height: 1.35;
            word-break: break-all;
            text-align: center;
        }

        .fortune-details {
            font-size: 9px;
            color: #4E342E;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 3px;
            border-radius: 6px;
            line-height: 1.3;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-item {
            display: block;
            word-break: break-all;
        }

        .empty-msg {
            color: #9E9E9E;
            font-size: 12px;
            text-align: center;
            padding: 20px 0;
            grid-column: span 7;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 id="mainTitle">✨ 이번주 운세</h2>
    </div>
    
    <div class="days-grid" id="daysGrid">
        <div class="empty-msg">7일치 시트 데이터를 불러오는 중입니다...</div>
    </div>
</div>

<script>
    const holidays2026 = {
        0: [1],
        1: [16, 17, 18],
        2: [1, 2],
        4: [5, 24, 25],
        5: [6],
        7: [15, 17],
        8: [24, 25, 26],
        9: [3, 5, 9],
        11: [25]
    };

    function cleanNumericDate(dateStr) {
        if (!dateStr) return '';
        return dateStr.replace(/[^0-9]/g, '').trim();
    }

    function getWeekDates() {
        const now = new Date();
        const currentDay = now.getDay();
        const todayNumeric = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;

        const shortDays = ["일", "월", "화", "수", "목", "금", "토"];
        const week = [];

        const sunday = new Date(now);
        sunday.setDate(now.getDate() - currentDay);

        for (let i = 0; i < 7; i++) {
            const d = new Date(sunday);
            d.setDate(sunday.getDate() + i);

            const y = d.getFullYear();
            const m = d.getMonth();
            const date = d.getDate();

            const monthStr = String(m + 1).padStart(2, '0');
            const dateStr = String(date).padStart(2, '0');

            const num1 = `${y}${monthStr}${dateStr}`;
            const num2 = `${y}${m + 1}${date}`;

            const isHoliday = holidays2026[m] && holidays2026[m].includes(date);

            week.push({
                dayIndex: i,
                formattedDate: `${monthStr}.${dateStr}(${shortDays[i]})`,
                matchKeys: [num1, num2],
                isToday: num1 === todayNumeric,
                isHoliday: isHoliday
            });
        }
        return week;
    }

    async function loadWeeklyFortunes() {
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJt4nYJdDup0o50_TUEeOAK4jKs9mPzXXd8sf-APg0BBn4BEdemk-8v1i3yXbDaIUqnPQvarfRSFVJ/pub?gid=0&single=true&output=csv';

        try {
            const res = await fetch(sheetUrl);
            const data = await res.text();

            const rows = data.replace(/\r/g, '').split('\n').map(r => {
                const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
                return r.split(regex).map(cell => {
                    return cell.trim().replace(/^"|"$/g, '').replace(/""/g, '"');
                });
            });

            const week = getWeekDates();
            
            const startDate = week[0].formattedDate.split('(')[0];
            const endDate = week[6].formattedDate.split('(')[0];
            document.getElementById('mainTitle').textContent = `✨ 이번주 운세 (${startDate} ~ ${endDate})`;

            const gridContainer = document.getElementById('daysGrid');
            gridContainer.innerHTML = '';

            week.forEach(dayInfo => {
                const matchedRow = rows.find(r => {
                    if (!r[0]) return false;
                    const sheetDate = cleanNumericDate(r[0]);
                    return dayInfo.matchKeys.includes(sheetDate);
                });

                const card = document.createElement('div');
                card.className = `day-card ${dayInfo.isToday ? 'is-today' : ''}`;

                let colorClass = 'weekday';
                if (dayInfo.dayIndex === 0) colorClass = 'sun';
                else if (dayInfo.dayIndex === 6) colorClass = 'sat';
                
                if (dayInfo.isHoliday) {
                    colorClass = 'holiday';
                }

                const score = matchedRow ? (matchedRow[1] || "-") + "점" : "-";
                const summary = matchedRow ? (matchedRow[2] || "운세 데이터 없음") : "시트에 데이터 없음";
                const money = matchedRow ? (matchedRow[3] || "-") : "-";
                const luckColor = matchedRow ? (matchedRow[4] || "-") : "-";

                card.innerHTML = `
                    <div class="card-top">
                        <div class="date-row">
                            <span class="day-date-label ${colorClass}">${dayInfo.formattedDate}</span>
                            ${dayInfo.isToday ? '<span class="today-tag">오늘</span>' : ''}
                        </div>
                        <div class="score-badge">${score}</div>
                    </div>
                    <div class="card-body">
                        <p class="fortune-summary">${summary}</p>
                        <div class="fortune-details">
                            <span class="detail-item">💰 ${money}</span>
                            <span class="detail-item">🎨 ${luckColor}</span>
                        </div>
                    </div>
                `;

                gridContainer.appendChild(card);
            });

        } catch (e) {
            console.error(e);
            document.getElementById('daysGrid').innerHTML = `<div class="empty-msg">구글 시트 연결 오류가 발생했습니다.</div>`;
        }
    }

    loadWeeklyFortunes();
</script>
</body>
</html>
