<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --main-purple: #7B1FA2;    /* 메인 보라 (월 이름, 오늘 날짜) */
            --soft-lavender: #F3E5F5;  /* 연보라 (요일 배경, 격자 테두리) */
            --bg-purple: #F8F0FA;      /* 아주 연한 배경 */
            --text-deep: #4A148C;      /* 진한 보라색 (가독성 텍스트) */
            --sun-red: #D32F2F;        /* 일요일/공휴일 적색 */
            --sat-blue: #1976D2;       /* 토요일 청색 */
            --bg-white: #ffffff;
        }

        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Pretendard', sans-serif;
        }

        .calendar-card {
            background-color: var(--bg-white);
            border: 3px solid var(--main-purple); 
            border-radius: 30px;
            padding: 20px;
            width: 230px;
            box-shadow: 0 10px 30px rgba(123, 31, 162, 0.15);
        }

        /* ✂️ 상단 점선 제거 및 간격 최적화 */
        .calendar-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        .month-name {
            font-size: 28px;
            font-weight: 900;
            color: var(--main-purple);
            display: block;
            letter-spacing: -1px;
        }

        .year-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-deep);
            opacity: 0.5;
            display: block;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid var(--soft-lavender);
            border-left: 1px solid var(--soft-lavender);
            border-radius: 10px;
            overflow: hidden;
        }

        .day-label, .date-cell {
            text-align: center;
            border-right: 1px solid var(--soft-lavender);
            border-bottom: 1px solid var(--soft-lavender);
            font-size: 12px;
            color: var(--text-deep);
        }

        .day-label {
            padding: 10px 0;
            font-weight: 800;
            background-color: var(--bg-purple); 
        }

        .sun { color: var(--sun-red) !important; }
        .sat { color: var(--sat-blue) !important; }

        .date-cell {
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
        }

        .other-month {
            color: #D1C4E9 !important; 
        }

        .holiday {
            color: var(--sun-red) !important;
        }

        .today {
            background-color: var(--main-purple);
            color: white !important;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            box-shadow: 0 4px 8px rgba(123, 31, 162, 0.3);
        }
    </style>
</head>
<body>

<div class="calendar-card">
    <div class="calendar-header">
        <span class="month-name" id="displayMonth"></span>
        <span class="year-name" id="displayYear"></span>
    </div>
    <div class="calendar-grid" id="calendarGrid">
        <div class="day-label sun">S</div>
        <div class="day-label">M</div>
        <div class="day-label">T</div>
        <div class="day-label">W</div>
        <div class="day-label">T</div>
        <div class="day-label">F</div>
        <div class="day-label sat">S</div>
    </div>
</div>

<script>
    const holidays2026 = {
        0: [1], 1: [16, 17, 18], 2: [1], 4: [5, 24], 5: [6], 7: [15], 8: [24, 25, 26], 9: [3, 9], 11: [25]
    };

    function generateCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('displayMonth').textContent = monthNames[month];
        document.getElementById('displayYear').textContent = year;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevDaysInMonth = new Date(year, month, 0).getDate();
        const grid = document.getElementById('calendarGrid');

        for (let i = firstDay - 1; i >= 0; i--) {
            const cell = document.createElement('div');
            cell.className = 'date-cell other-month';
            cell.textContent = prevDaysInMonth - i;
            grid.appendChild(cell);
        }

        for (let i = 1; i <= daysInMonth; i++) {
            const cell = document.createElement('div');
            cell.className = 'date-cell';
            const dateObj = new Date(year, month, i);
            const dayOfWeek = dateObj.getDay();
            const isHoliday = holidays2026[month] && holidays2026[month].includes(i);

            if (dayOfWeek === 0 || isHoliday) {
                cell.classList.add('holiday');
            } else if (dayOfWeek === 6) {
                cell.classList.add('sat');
            }

            if (i === today) {
                const span = document.createElement('span');
                span.className = 'today';
                span.textContent = i;
                cell.appendChild(span);
            } else {
                cell.textContent = i;
            }
            grid.appendChild(cell);
        }
    }
    generateCalendar();
</script>
</body>
</html>
