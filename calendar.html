<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --main-pink: #F06292;      /* 메인 진한 핑크 (월 이름, 오늘 날짜) */
            --soft-pink: #FCE4EC;      /* 연한 핑크 (요일 배경, 격자 테두리) */
            --bg-pink: #FFF1F5;        /* 아주 연한 배경 핑크 */
            --text-dark: #880E4F;      /* 텍스트용 진한 자주색 (가독성 확보) */
            --sun-red: #E91E63;        /* 일요일/공휴일용 핑크빛 레드 */
            --sat-blue: #448AFF;       /* 토요일용 산뜻한 블루 */
            --bg-white: #ffffff;
        }

        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Pretendard', sans-serif;
        }

        /* 🌸 라운드 스퀘어 카드 디자인 강화 */
        .calendar-card {
            background-color: var(--bg-white);
            border: 3px solid var(--main-pink);
            border-radius: 30px;
            padding: 20px;
            width: 230px;
            box-shadow: 0 10px 30px rgba(240, 98, 146, 0.2);
        }

        .calendar-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px dashed var(--soft-pink);
        }

        .month-name {
            font-size: 28px;
            font-weight: 900;
            color: var(--main-pink);
            display: block;
            letter-spacing: -1px;
        }

        .year-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            opacity: 0.5;
            display: block;
        }

        /* 🌸 격자 테두리를 핑크색으로 변경 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid var(--soft-pink);
            border-left: 1px solid var(--soft-pink);
            border-radius: 10px;
            overflow: hidden;
        }

        .day-label, .date-cell {
            text-align: center;
            border-right: 1px solid var(--soft-pink);
            border-bottom: 1px solid var(--soft-pink);
            font-size: 12px;
            color: var(--text-dark);
        }

        .day-label {
            padding: 10px 0;
            font-weight: 800;
            background-color: var(--bg-pink);
        }

        .sun { color: var(--sun-red) !important; }
        .sat { color: var(--sat-blue) !important; }

        .date-cell {
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
        }

        .other-month {
            color: #F8BBD0 !important; /* 이전/다음달은 연한 핑크회색 */
        }

        .holiday {
            color: var(--sun-red) !important;
        }

        /* 🌸 오늘 날짜 강조 (진한 핑크 원) */
        .today {
            background-color: var(--main-pink);
            color: white !important;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            box-shadow: 0 4px 8px rgba(240, 98, 146, 0.4);
        }
    </style>
</head>
<body>

<div class="calendar-card">
    <div class="calendar-header">
        <span class="month-name" id="displayMonth"></span>
        <span class="year-name" id="displayYear"></span>
    </div>
    <div class="calendar-grid" id="calendarGrid">
        <div class="day-label sun">S</div>
        <div class="day-label">M</div>
        <div class="day-label">T</div>
        <div class="day-label">W</div>
        <div class="day-label">T</div>
        <div class="day-label">F</div>
        <div class="day-label sat">S</div>
    </div>
</div>

<script>
    // 2026년 공휴일 데이터 적용
    const holidays2026 = {
        0: [1], 1: [16, 17, 18], 2: [1], 4: [5, 24], 5: [6], 7: [15], 8: [24, 25, 26], 9: [3, 9], 11: [25]
    };

    function generateCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('displayMonth').textContent = monthNames[month];
        document.getElementById('displayYear').textContent = year;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevDaysInMonth = new Date(year, month, 0).getDate();
        const grid = document.getElementById('calendarGrid');

        // 이전 달 날짜 채우기
        for (let i = firstDay - 1; i >= 0; i--) {
            const cell = document.createElement('div');
            cell.className = 'date-cell other-month';
            cell.textContent = prevDaysInMonth - i;
            grid.appendChild(cell);
        }

        // 이번 달 날짜 채우기
        for (let i = 1; i <= daysInMonth; i++) {
            const cell = document.createElement('div');
            cell.className = 'date-cell';
            const dateObj = new Date(year, month, i);
            const dayOfWeek = dateObj.getDay();
            const isHoliday = holidays2026[month] && holidays2026[month].includes(i);

            if (dayOfWeek === 0 || isHoliday) {
                cell.classList.add('holiday');
            } else if (dayOfWeek === 6) {
                cell.classList.add('sat');
            }

            if (i === today) {
                const span = document.createElement('span');
                span.className = 'today';
                span.textContent = i;
                cell.appendChild(span);
            } else {
                cell.textContent = i;
            }
            grid.appendChild(cell);
        }

        // 🌸 마지막 주 비어있는 칸 다음 달 날짜(1, 2, 3...)로 채우기
        const lastDayIndex = new Date(year, month, daysInMonth).getDay();
        const nextDays = (6 - lastDayIndex); // 토요일(6)까지 남은 일수 계산
        for (let i = 1; i <= nextDays; i++) {
            const cell = document.createElement('div');
            cell.className = 'date-cell other-month';
            cell.textContent = i;
            grid.appendChild(cell);
        }
    }
    generateCalendar();
</script>
</body>
</html>
